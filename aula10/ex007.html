<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Valores</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        input[type="number"]{
            padding: 10px;
            margin: 10px;
            width: 200px;
        }
        div#res{
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" name="txtn1" id="txtn1" placeholder="Digite um número"> +
    <input type="number" name="txtn2" id="txtn2" placeholder="Digite outro número">
    <input type="button" onclick="somar()" value="Somar">
    <div id="res">Resultado</div>
    <script>
        function somar(){
            var tn1 = window.document.getElementById('txtn1');
            var tn2 = window.document.querySelector('input#txtn2');
            var res = window.document.getElementById('res');
            var n1 = Number(tn1.value);
            var n2 = Number(tn2.value);
            var s = n1 + n2;
            res.innerText = `A soma entre ${n1} e ${n2} é igual a<strong> ${s}</strong> `;
        }
    </script>
</body>
</html>
