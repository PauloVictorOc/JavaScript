<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: cornsilk;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Este é o meu primeiro código HTML com JavaScript.</p>
    <script>
        var n1 = window.prompt('Digite um número') //var n1 = Number.parseInt(window.prompt('Digite um número')) / var n1 = Number.parseFloat(window.prompt('Digite um número'))
        var n2 = window.prompt('Digite outro número') //var n2 = Number.parseInt(window.prompt('Digite outro número')) / var n2 = Number.parseFloat(window.prompt('Digite outro número'))
        var resultado = Number(n1) + Number(n2)
        window.alert('O resultado da soma é: ' + resultado) // pode se usar o placeholder ${resultado} dentro de crases `O resultado da soma é: ${resultado}`

        //para converter um número para string, basta usar o método toString() ou a função String()
    </script>
</body>
</html>
