<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificar Idade</h1>
    </header>
    <section>
        <div>
            <p>Ano de Nascimento:
            <input type="number" name="txtano"  id="txtano" placeholder="Ano de Nascimento" min="0">
            </p>
            <p>Sexo:
                <input type="radio" name="radsex" id="mas" value="Masculino" checked>
                <label for="mas">Masculino</label>
                <input type="radio" name="radsex" id="fem" value="Feminino" checked>
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" value="Verificar" onclick="verificar()">
            </p>
        </div>
        <div id="res">
            Preencha os campos acima e clique no botão "Verificar".
        </div>
    </section>
    <footer>
        <p>&copy; 2026 - Paulo Victor (viCtor)</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
