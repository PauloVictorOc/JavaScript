<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistemas de Multas</h1>
    Velocidade do carro:<input type="number" name="txtvel" id="txtvel" placeholder="Digite a velocidade do carro">
    <button type="button" value="verificar" onclick="calcular()">Verificar Velocidade</button>
    <div id="res">
        
    </div>
    <script>
        function calcular() {
        var txtv = window.document.querySelector('input#txtvel')
        var res = window.document.querySelector('div#res')
        var vel = Number(txtv.value)
        res.innerHTML = '<p>Sua velocidade atual é de <strong> ' + vel + ' </strong> Km/h</p>'
        if (vel > 60) {
            res.innerHTML += '<p>Você ultrapassou a velocidade permitida. MULTADO!</p>'
        }
        res.innerHTML += '<p>Dirija sempre com cinto de segurança!</p>'
    }
    </script>
</body>
</html>
