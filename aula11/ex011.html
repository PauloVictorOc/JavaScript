<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origem</title>
</head>
<body>
    <h1>País de Origem</h1>
    País de origem:<input type="text" name="txtpais" id="txtpais" placeholder="Digite o país de nascimento">
    <button type="button" value="verificar" onclick="verificar()">Verificar País</button>
    <div id="res">
        
    </div>
    <script>
        function verificar() {
        var txtp = window.document.querySelector('input#txtpais')
        var res = window.document.querySelector('div#res')
        var pais = txtp.value
        res.innerHTML = '<p>Você nasceu no país: <strong> ' + pais + ' </strong></p>'
        if (pais == "Brasil") {
            res.innerHTML += '<p>Você é Brasileiro!</p>'
        }
        else {
            res.innerHTML += '<p>Você é Estrangeiro!</p>'
        }
    }
    </script>
</body>
</html>
